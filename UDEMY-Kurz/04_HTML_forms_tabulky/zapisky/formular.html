<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulare</title>
</head>
<body>
    
    <h1>Ukazka formuláře</h1>

    <button>MIMO FORMULAR</button> <!-- tlačítko mimo formulář, které neodesílá data - nestane se nic -->

    <hr>

    <form action="/tacos">    <!-- Odeslání dat na server a následné přesměrování -->
        <button type="button">Neklikej (stejně tě nikam neodkážu)</button> <!-- tlačítko, které neodesílá data - nestane se nic -->
        <!-- různé druhy inputu -->
        <p>
            <label for="jmeno">Zadej své Jméno:</label> <!-- label je asociován urč. inputu -->
            <input id="jmeno" type="text" placeholder="Zadej jméno" name="jmeno"> <!-- id je důležité pro label, aby se po kliknutí na něj aktivoval input -->
        </p>
        <p>
            <label for="heslo">Zadej heslo:</label>
            <input id="heslo" type="password" name="heslo">
        </p>
        <button>uprostřed</button>
        <p>
            <label for="barva">Vyber si barvu:</label>
            <input id="barva" type="color" name="barva">
        </p>
        <p>
            <label for="cislo">Vyber si cislo:</label>
            <input id="cislo" type="number" name="cislo" min="1" max="100" step="1" value="50"> <!-- min, max, step a value jsou atributy pro nastavení číselného inputu -->
        </p>
        <!-- existuje jich opravdu mnoho :D -->
         <button>Odeslat</button> <!-- tlačítko pro odeslání formuláře -->
    </form>

    <hr>

    <h2>Využití form s atr. name="" pro vyhledávání na jinných serverech</h2>
    <h3>Reddit</h3>
    <form action="https://www.reddit.com/search">
        <input type="text" name="q"> <!-- dávat pozor na správné nastavení jmen!!! -->
        <button>Vyhledat na Redditu</button>
    </form>
    <h3>Google</h3>
    <form action="https://www.google.com/search">
        <input type="text" name="q"> 
        <button>Vyhledat na Googlu</button>
    </form>
    <h3>YouTube</h3>
    <form action="https://www.youtube.com/results">
        <input type="text" name="search_query"> <!-- jméno inputu musí být search_query, aby to fungovalo -->
        <button>Vyhledat na Youtube</button>
    </form>

    <hr>

    <h2>další vstupy</h2>

    <form action="/birds">
        <input type="checkbox" name="Souhlas_TOS" id="souhlas" checked> <!-- checkbox -->
        <label for="souhlas">Souhlasím s podmínkami (checkbox)</label>

        <h3>Velikosti triček (radio button)</h3>
        <p>
            <label for="xs">XS</label>
            <input type="radio" name="size" id="xs" value="xs"> <!-- radio button -->
            <label for="s">S</label>
            <input type="radio" name="size" id="s" value="s"> <!-- value je potřeba aby se odesílala jiná hodnota než on (zaškrtnuto) -->
            <label for="m">M</label>
            <input type="radio" name="size" id="m" value="m">
        </p>
        
        <p>
            <label for="jidlo">Vyber si jídlo (select)</label>
            <select name="jidlo" id="jidlo"> <!-- select je rozbalovací menu -->
                <option value="fish">Ryby</option>
                <option value="veg">Vegetarian</option>
                <option value="steak" selected>Stejk nom nom</option>
            </select>
        </p>

        <p>
            <label for="cheese">Množství sýra (range)</label>
            <input type="range" name="cheese_level" id="cheese" min="0" max="100" step="10" value="40"> <!-- range je posuvník -->
        </p>

        <p>
            <label for="request">Něco co chceš říci?</label>
            <br>
            <textarea name="" id="request" rows="10" placeholder="Napiš nějaký text!" cols="40"></textarea>
        </p>

        <button>Submit</button>
    </form>
    <hr>

    <h2>Ukázka validace(ověření)</h2>

    <form action="/dummy">
        <label for="first">Zadej Křestní jméno: </label>
        <input type="text" name="first" id="first" required> <!-- required znamená, že je to povinné pole a musí být vyplněno -->
        <p>
            <label for="username">Uživ. jméno: </label>
            <input type="text" name="" id="username" minlength="5" maxlength="20" required> <!-- minlength a maxlength určují minimální a maximální délku textu -->
        </p>

        <p>
            <label for="web">Zadej adr. webu</label>
            <input type="url" name="" id="web" required>
        </p>

        <p>
            <label for="email">Zadej E-mailovou adr.: </label>
            <input type="email" name="" id="email" required> <!-- type="email" znamená, že to musí být platný email -->
        </p>

        <button>Submit</button>
    </form>

</body>
</html>
