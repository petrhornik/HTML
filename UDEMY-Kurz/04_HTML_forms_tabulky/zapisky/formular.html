<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulare</title>
</head>
<body>
    
    <h1>Ukazka formuláře</h1>

    <button>MIMO FORMULAR</button> <!-- tlačítko mimo formulář, které neodesílá data - nestane se nic -->

    <hr>

    <form action="/tacos">    <!-- Odeslání dat na server a následné přesměrování -->
        <button type="button">Neklikej</button> <!-- tlačítko, které neodesílá data - nestane se nic -->
        <!-- různé druhy inputu -->
        <p>
            <label for="jmeno">Zadej své Jméno:</label> <!-- label je asociován urč. inputu -->
            <input id="jmeno" type="text" placeholder="Zadej jméno" name="jmeno"> <!-- id je důležité pro label, aby se po kliknutí na něj aktivoval input -->
        </p>
        <p>
            <label for="heslo">Zadej heslo:</label>
            <input id="heslo" type="password" name="heslo">
        </p>
        <button>uprostřed</button>
        <p>
            <label for="barva">Vyber si barvu:</label>
            <input id="barva" type="color" name="barva">
        </p>
        <p>
            <label for="cislo">Vyber si cislo:</label>
            <input id="cislo" type="number" name="cislo">
        </p>
        <!-- existuje jich opravdu mnoho :D -->
         <button>Odeslat</button> <!-- tlačítko pro odeslání formuláře -->
    </form>

    <hr>

    <h2>Využití form s atr. name="" pro vyhledávání na jinných serverech</h2>
    <h3>Reddit</h3>
    <form action="https://www.reddit.com/search">
        <input type="text" name="q"> <!-- dávat pozor na správné nastavení jmen!!! -->
        <button>Vyhledat na Redditu</button>
    </form>
    <h3>Google</h3>
    <form action="https://www.google.com/search">
        <input type="text" name="q"> 
        <button>Vyhledat na Googlu</button>
    </form>
    <h3>YouTube</h3>
    <form action="https://www.youtube.com/results">
        <input type="text" name="search_query"> <!-- jméno inputu musí být search_query, aby to fungovalo -->
        <button>Vyhledat na Youtube</button>
    </form>
</body>
</html>
